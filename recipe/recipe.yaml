schema_version: 1

context:
  name: dbt-artifacts-parser
  version: "0.13.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: abb798aa73ff8cc295b4ecf03ee02d6a3bc48ad79f7d093d4bb3ffef68e77fb4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.0,<3.0

tests:
  - python:
      imports:
        - dbt_artifacts_parser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A dbt artifacts parser in python
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/yu-iskw/dbt-artifacts-parser

extra:
  recipe-maintainers:
    - thewchan
